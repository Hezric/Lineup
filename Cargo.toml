[package]
name = "lineup"
version = "0.1.0"
edition = "2024"
description = "A JSON-first Windows startup manager"
license = "MIT"
repository = "https://github.com/Hezric/Lineup"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.60", default-features = false }
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Registry", "Win32_System_Com",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_TaskScheduler",
  "Win32_System_Threading", "Win32_Security", "Win32_System_Environment",
  "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Variant",
  "Win32_Storage_FileSystem", "Win32_Security_Authorization",
] }
toml = "1.1.8"

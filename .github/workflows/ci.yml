name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          #requires -Version 7.0
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
      - name: Format
        run: |
          #requires -Version 7.0
          cargo fmt --check
      - name: Clippy
        run: |
          #requires -Version 7.0
          cargo clippy --all-targets -j 2 -- -D warnings
      - name: Unit and CLI tests
        run: |
          #requires -Version 7.0
          cargo test -j 2 --locked
      - name: Build
        run: cargo build --release --locked -j 2
      - name: Read-only examples in documented Windows shells
        run: ./tests/shell-examples.ps1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Verify third-party notices
        run: cargo about generate --locked --fail about.hbs --output-file target/THIRD-PARTY-NOTICES.txt
      - name: Current-user integration
        env:
          LINEUP_REAL_TESTS: '1'
        run: |
          #requires -Version 7.0
          cargo test -j 2 --locked --test real_windows -- --nocapture
      - name: Elevated integration
        env:
          LINEUP_ELEVATED_TESTS: '1'
        run: |
          #requires -Version 7.0
          cargo test -j 2 --locked --test real_windows_elevated -- --nocapture
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          branch: ${{ github.event_name != 'push' && !startsWith(github.head_ref, 'dependabot/') }}
          pr-title: ${{ github.event_name == 'pull_request' }}
      - name: Check exact branch name
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$BRANCH" != dependabot/* && ( "$EVENT" == pull_request || "$BRANCH" != main ) ]]; then
            [[ "$BRANCH" =~ ^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]
          fi
      - name: Check every pushed commit
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          before = os.environ['BEFORE']
          known = before.strip('0') and subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'], capture_output=True).returncode == 0
          if not known:
              main = subprocess.run(['git', 'rev-parse', '--verify', 'origin/main'], capture_output=True, text=True)
              before = git('merge-base', 'HEAD', 'origin/main') if main.returncode == 0 else ''
          rev = f'{before}..HEAD' if before else 'HEAD'
          pattern = tomllib.load(open('cchk.toml', 'rb'))['commit']['message_pattern']
          for sha in git('rev-list', rev).splitlines():
              message = git('show', '-s', '--format=%B', sha)
              if not re.fullmatch(pattern, message):
                  raise SystemExit(f'{sha}: invalid scoped Conventional Commit: {message.splitlines()[0]}')
          PY

name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to retry after repairing the workflow
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Checkout can dereference an annotated tag during push-event SHA validation.
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(git rev-parse "$RELEASE_TAG")" --jq '.verification.verified' | grep -qx true
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: MinoruSekine/setup-scoop@v5.0.1
      - name: Install version parser
        shell: pwsh
        run: scoop install yq
      - name: Check declared version fields
        shell: pwsh
        env:
          VERSION_FIELDS: '{"Cargo.toml":[".package.version"],"Cargo.lock":[".package[] | select(.name == \"lineup\") | .version"]}'
        run: |
          #requires -Version 7.0
          $ErrorActionPreference = 'Stop'
          $fields = $env:VERSION_FIELDS | ConvertFrom-Json -AsHashtable
          if ($fields -isnot [Collections.IDictionary] -or $fields.Count -eq 0) { throw 'Declare every package version file in a JSON object.' }
          foreach ($entry in $fields.GetEnumerator()) {
            $file = $entry.Key
            $format = if ([IO.Path]::GetExtension($file) -in '.toml', '.lock' -and $file -notlike '*package-lock.json') { 'toml' } else { 'json' }
            if ($entry.Value -isnot [array] -or $entry.Value.Count -eq 0) { throw "Declare a nonempty version field array for $file" }
            foreach ($field in $entry.Value) {
              if ($field -isnot [string] -or !$field) { throw "Invalid version expression for $file" }
              $values = @(yq -p $format -o json -r $field $file)
              if ($LASTEXITCODE -or $values.Count -ne 1 -or $values[0] -cne $env:RELEASE_TAG.Substring(1)) {
                throw "Tag and declared version differ: $file $field"
              }
            }
          }
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Test
        shell: pwsh
        run: cargo test -j 2 --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Package
        shell: pwsh
        run: |
          #requires -Version 7.0
          cargo build --release --locked -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo about generate --locked --fail about.hbs --output-file target/THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force target/package | Out-Null
          Copy-Item -Recurse skills target/package/skills
          Copy-Item target/release/lineup.exe, LICENSE, README.md, README_zh-Hans.md, target/THIRD-PARTY-NOTICES.txt target/package
          Compress-Archive -Path target/package/* -DestinationPath "dist/lineup-${env:RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cd ..
          python - "$RELEASE_TAG" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1].removeprefix('v')
          text = pathlib.Path('CHANGELOG.md').read_text()
          sections = re.split(r'^## ', text, flags=re.M)
          notes = next(s for s in sections[1:] if s.splitlines()[0].startswith(f'[{version}]'))
          pathlib.Path('release-notes.md').write_text('## ' + notes)
          PY
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md

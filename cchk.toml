[commit]
conventional_commits = true
message_pattern = '^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)\([a-z0-9][a-z0-9.-]*\)!?: [^\n]+(?:\n[\s\S]*)?$'
subject_capitalized = false
subject_imperative = false
subject_max_length = 120
allow_merge_commits = false
allow_revert_commits = false
allow_fixup_commits = false
ignore_authors = []

[branch]
conventional_branch = true
allow_branch_types = ["feat", "fix", "perf", "refactor", "docs", "style", "test", "build", "ci", "chore", "revert"]
require_description_grammar = true
ignore_authors = []
